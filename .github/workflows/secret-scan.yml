name: Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  betterleaks:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Betterleaks
        run: |
          set -euo pipefail
          VER=1.9.0
          BASE="https://github.com/betterleaks/betterleaks/releases/download/v${VER}"
          TARBALL="betterleaks_${VER}_linux_x64.tar.gz"
          echo "Downloading ${BASE}/${TARBALL}"
          curl -fsSL -o "/tmp/${TARBALL}" "${BASE}/${TARBALL}"
          curl -fsSL -o /tmp/checksums.txt "${BASE}/checksums.txt"
          ls -la "/tmp/${TARBALL}" /tmp/checksums.txt
          EXPECT=$(grep " ${TARBALL}\$" /tmp/checksums.txt | awk '{print $1}')
          ACTUAL=$(sha256sum "/tmp/${TARBALL}" | awk '{print $1}')
          echo "expected: ${EXPECT}"
          echo "actual:   ${ACTUAL}"
          if [ -z "${EXPECT}" ] || [ "${EXPECT}" != "${ACTUAL}" ]; then
            echo "::error::checksum verification failed"
            exit 1
          fi
          tar xzf "/tmp/${TARBALL}" -C /tmp
          sudo install -m 0755 /tmp/betterleaks /usr/local/bin/betterleaks
          betterleaks version

      - name: Scan new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${PR_BASE:-}" ]; then
            RANGE="${PR_BASE}..${PR_HEAD}"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${BEFORE}..${AFTER}"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "Scanning commit range: ${RANGE}"
          betterleaks git . --log-opts="${RANGE}" \
            --baseline-path .github/betterleaks-baseline.json \
            --redact --no-banner --verbose
