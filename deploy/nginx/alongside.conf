# Alongside · nginx（容器内 80）
# SSE 三行不可省；API 反代到 api 容器
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★ SSE / WebSocket 长连接（漏配会断流）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
    }

    location /healthz {
        proxy_pass http://api:8000/healthz;
        access_log off;
    }

    # ★ ISSUE-010 修复（2026-09-23）：/readyz 之前落到 location / 的 SPA fallback
    #   返回 text/html，被 MiMo 探针抓出（SPA-SWALLOWED）。与 healthz 并列精确反代。
    location = /readyz {
        proxy_pass http://api:8000/readyz;
        access_log off;
    }

    # ★ ⑨ BeeCount 内嵌（同源反代）——资产绝对路径必须 sub_filter 改写，
    #   否则 HTML 里 /assets/* 会被下面 location / 的 SPA 兜底吃掉（白屏根因，MiMo 18:5x 实测）。
    #   生产 conf 若另有 /ext/beecount/ 块，以本块语义为准合并。
    location /ext/beecount/ {
        proxy_pass http://beecount:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        sub_filter_types text/html;
        sub_filter_once off;
        sub_filter 'src="/assets/' 'src="/ext/beecount/assets/';
        sub_filter 'href="/assets/' 'href="/ext/beecount/assets/';
        sub_filter 'src="/branding/' 'src="/ext/beecount/branding/';
        sub_filter 'href="/branding/' 'href="/ext/beecount/branding/';
        sub_filter 'href="/manifest.webmanifest"' 'href="/ext/beecount/manifest.webmanifest"';
    }

    # ★ /plugin-assets/ —— 第三方插件的 UI 产物（r5 热插拔 · 层2.2 的部署面）
    #
    #   ★ 必须反代到后端（api:8000），**不能**像 SPA 那样当静态 root 发：
    #     资产端点自己要在请求粒度做三件事 ——
    #       ① 校验 Bearer 令牌（未登录 401）
    #       ② 查插件 phase（未启用 404，即「拔掉」要连 UI 一起拔）
    #       ③ 逐跳判路径归属（穿越防护）
    #     nginx 直接读磁盘会把这三样全部绕过：未启用的插件 JS 照样能下载，
    #     而且插件目录里 manifest.json / api/*.py 也会变成可读 URL。
    #
    #   ★ 前缀刻意**不是** `/assets/`：前端 sw.js 对 `/assets/` 是 cache-first，
    #     插件资产放进去会被 Service Worker 钉死，装了新版本仍加载旧的。
    location /plugin-assets/ {
        proxy_pass http://api:8000/plugin-assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ★ 必须透传 Authorization：资产端点的鉴权头由浏览器发出，
        #   漏了这一行 ⇒ 所有资产请求 401（最典型的「本地能跑线上白屏」）。
        proxy_set_header Authorization $http_authorization;

        # 资产是普通短请求，无需 SSE 那套长连接配置；
        # 但**不要**在 nginx 层缓存 —— 插件更新后必须立刻拿到新产物。
        proxy_cache off;
        # 后端已发 Cache-Control: no-cache + nosniff（见 core/plugins/assets.py），
        # 这里只补一条：不让中间代理缓存未鉴权内容。
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 基础安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
}
