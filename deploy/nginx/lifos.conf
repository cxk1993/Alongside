# Alongside · nginx（容器内 80）
# SSE 三行不可省；API 反代到 api 容器
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★ SSE / WebSocket 长连接（漏配会断流）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
    }

    location /healthz {
        proxy_pass http://api:8000/healthz;
        access_log off;
    }

    # ★ ISSUE-010 修复（2026-09-23）：/readyz 之前落到 location / 的 SPA fallback
    #   返回 text/html，被 MiMo 探针抓出（SPA-SWALLOWED）。与 healthz 并列精确反代。
    location = /readyz {
        proxy_pass http://api:8000/readyz;
        access_log off;
    }

    # ★ ⑨ BeeCount 内嵌（同源反代）——资产绝对路径必须 sub_filter 改写，
    #   否则 HTML 里 /assets/* 会被下面 location / 的 SPA 兜底吃掉（白屏根因，MiMo 18:5x 实测）。
    #   生产 conf 若另有 /ext/beecount/ 块，以本块语义为准合并。
    location /ext/beecount/ {
        proxy_pass http://beecount:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        sub_filter_types text/html;
        sub_filter_once off;
        sub_filter 'src="/assets/' 'src="/ext/beecount/assets/';
        sub_filter 'href="/assets/' 'href="/ext/beecount/assets/';
        sub_filter 'src="/branding/' 'src="/ext/beecount/branding/';
        sub_filter 'href="/branding/' 'href="/ext/beecount/branding/';
        sub_filter 'href="/manifest.webmanifest"' 'href="/ext/beecount/manifest.webmanifest"';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 基础安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
}
